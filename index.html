<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyEdoctor</title>
    <meta name="description" content="MyEdoctor telemedicine app for patients, doctors, and administrators." />
    <meta name="theme-color" content="#0f8f76" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyEdoctor" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />

    <meta property="og:title" content="MyEdoctor" />
    <meta property="og:type" content="website" />

    <!-- Paystack Inline JS (loaded only for localhost or when enabled via VITE_PAYSTACK_ENABLE_REMOTE) -->
    <script>
      (function () {
        const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        const params = new URLSearchParams(location.search);
        const enableRemote = params.get('enablePaystackRemote') === 'true'
          || (typeof localStorage !== 'undefined' && localStorage.getItem('enablePaystackRemote') === 'true');

        if (isLocalhost || enableRemote) {
          const s = document.createElement('script');
          s.src = 'https://js.paystack.co/v1/inline.js';
          s.async = true;
          document.head.appendChild(s);
        } else {
          console.warn('Paystack inline JS not loaded (remote environment). Set enablePaystackRemote=true in query string or localStorage to enable.');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
