<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyEdoctor</title>
    <meta name="description" content="MyEdoctor telemedicine app for patients, doctors, and administrators." />
    <meta name="theme-color" content="#0f8f76" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyEdoctor" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />

    <script>
      (function () {
        // Detect current path to swap PWA manifest
        const path = window.location.pathname;
        const manifestLink = document.querySelector('link[rel="manifest"]');
        if (manifestLink) {
          if (path.startsWith('/admin')) {
            manifestLink.setAttribute('href', '/admin-manifest.json');
            document.title = "MyEdoctor Admin";
          } else if (path.startsWith('/coo')) {
            manifestLink.setAttribute('href', '/coo-manifest.json');
            document.title = "MyEdoctor COO";
          }
        }

        // Paystack SDK is loaded lazily only when needed by the app payment hook.
        // Do not preload inline.js globally to avoid cross-origin popup issues.
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
